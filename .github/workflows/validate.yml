name: Validate Friends pull requests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Verify static export routes
        run: |
          test -s out/index.html
          test -s out/login/index.html
          test -s out/signup/index.html
          test -s out/app/index.html
